<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSNI 120 SketchUp Video Test</title>
</head>

<body>
  <h1>DSNI 120 SketchUp Video Test</h1>
  <p>If the video below plays, the web-page portion of our test works.</p>

  <iframe
    width="800"
    height="450"
    src="https://www.youtube.com/embed/0bPreK30yz0"
    title="SketchUp Tutorial Test"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>
  <br><br>

<button onclick="sendToSketchUp()">
  Test SketchUp Connection
</button>

<p id="status">Waiting for button test...</p>

<script>
  function sendToSketchUp() {
    if (window.sketchup && window.sketchup.test_connection) {
      window.sketchup.test_connection("Hello from the GitHub lesson page!");
      document.getElementById("status").innerText =
        "Message sent to SketchUp.";
    } else {
      document.getElementById("status").innerText =
        "SketchUp connection not detected.";
    }
  }
</script>
</body>
</html>
